<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Negocios</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e5ddd5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat {
      width: 390px;
      height: 620px;
      background: #efeae2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .header {
      background: #075e54;
      color: white;
      padding: 16px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #dcf8c6;
    }

    .bot {
      align-self: flex-start;
      background: white;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #f0f0f0;
      gap: 8px;
    }

    input {
      flex: 1;
      border: none;
      border-radius: 20px;
      padding: 12px 16px;
      font-size: 14px;
      outline: none;
    }

    button {
      border: none;
      background: #25d366;
      color: white;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #1ebe5d;
    }
  </style>
</head>
<body>

  <div class="chat">
    <div class="header">Asesor de negocios</div>

    <div class="messages" id="messages">
      <div class="msg bot">
        Hola, dime qué negocio quieres abrir y te digo qué trámites necesitas.
      </div>
    </div>

    <div class="input-area">
      <input id="input" type="text" placeholder="Escribe un mensaje...">
      <button onclick="enviar()">➤</button>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        enviar();
      }
    });

    async function enviar() {
      const texto = input.value.trim();

      if (!texto) return;

      agregarMensaje(texto, "user");
      input.value = "";

      agregarMensaje("Escribiendo...", "bot");

      const respuesta = await fetch("/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          mensaje: texto
        })
      });

      const data = await respuesta.json();

      const escribiendo = messages.lastChild;
      escribiendo.textContent = data.respuesta;

      messages.scrollTop = messages.scrollHeight;
    }

    function agregarMensaje(texto, tipo) {
      const div = document.createElement("div");
      div.className = "msg " + tipo;
      div.textContent = texto;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>

</body>
</html>
